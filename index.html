<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Happy Birthday, Sir Jose Manuel R. Guitarte!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;
 background:radial-gradient(circle at 20% 15%,#3b2a63,#1a1033 55%,#0d0820);
 color:#fff;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
canvas#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:2;width:100%;max-width:820px;display:flex;flex-direction:column;align-items:center}

/* ---------- ENVELOPE ---------- */
.stage{perspective:1400px;display:flex;flex-direction:column;align-items:center;gap:26px}
.hint{font-size:.95rem;letter-spacing:3px;text-transform:uppercase;color:#ffd7a0;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.envelope{position:relative;width:min(88vw,460px);height:min(58vw,300px);cursor:pointer;
 filter:drop-shadow(0 30px 45px rgba(0,0,0,.6));transition:transform .6s}
.envelope:hover{transform:translateY(-8px) scale(1.02)}
.env-back{position:absolute;inset:0;background:linear-gradient(145deg,#c0392b,#8e1d16);border-radius:10px}
.flap{position:absolute;top:0;left:0;width:100%;height:56%;background:linear-gradient(160deg,#e05a48,#a32a20);
 clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s cubic-bezier(.6,-0.3,.3,1.3);z-index:6;border-radius:10px 10px 0 0}
.open .flap{transform:rotateX(180deg);z-index:1}
.pocket{position:absolute;bottom:0;left:0;width:100%;height:100%;z-index:5;
 background:linear-gradient(150deg,#d24634,#96211a);
 clip-path:polygon(0 100%,100% 100%,100% 22%,50% 72%,0 22%);border-radius:0 0 10px 10px}
.wax{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#ffd86b,#e0a021 60%,#a86f10);z-index:7;display:grid;place-items:center;
 font-family:Georgia,serif;font-size:1.6rem;color:#6b4406;box-shadow:0 6px 16px rgba(0,0,0,.45);transition:.5s}
.open .wax{opacity:0;transform:translate(-50%,-140%) scale(.4)}
.letter{position:absolute;left:5%;width:90%;bottom:12%;background:#fffaf0;color:#3a2a12;border-radius:8px;
 padding:16px;z-index:4;text-align:center;transition:transform 1s .5s cubic-bezier(.3,1.4,.5,1);transform:translateY(0) scale(.96)}
.open .letter{transform:translateY(-78%) scale(1)}
.letter h3{font-family:Georgia,serif;color:#a32a20;font-size:1.05rem}
.letter p{font-size:.8rem;opacity:.75;margin-top:4px}

/* ---------- CARD ---------- */
.card{display:none;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
 backdrop-filter:blur(14px);border-radius:26px;padding:34px 28px;text-align:center;
 box-shadow:0 30px 70px rgba(0,0,0,.55);animation:rise .9s ease both}
.card.show{display:block}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.95)}to{opacity:1;transform:none}}
.badge{display:inline-block;font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:#1a1033;
 background:linear-gradient(90deg,#ffd86b,#ffb347);padding:6px 16px;border-radius:99px;font-weight:700}
h1{margin:16px 0 6px;font-family:Georgia,serif;font-size:clamp(1.8rem,6vw,3rem);line-height:1.15;
 background:linear-gradient(90deg,#ffd86b,#ff8fab,#8fd3ff,#ffd86b);background-size:300% auto;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% center}}
.sub{color:#ffd7a0;letter-spacing:2px;font-size:.9rem;margin-bottom:22px}
.photo{width:190px;height:190px;border-radius:50%;object-fit:cover;border:5px solid transparent;
 background:linear-gradient(#0d0820,#0d0820) padding-box,linear-gradient(135deg,#ffd86b,#ff8fab,#8fd3ff) border-box;
 box-shadow:0 18px 40px rgba(0,0,0,.6);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.msg{max-width:640px;margin:26px auto 0;text-align:left;line-height:1.85;font-size:1.02rem;color:#f3ecff}
.msg p{margin-bottom:14px}
.sig{text-align:right;font-family:Georgia,serif;font-style:italic;color:#ffd86b;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:26px 0 6px}
.tile{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;
 transition:.3s;cursor:default}
.tile:hover{transform:translateY(-6px);background:rgba(255,216,107,.13);border-color:#ffd86b}
.tile b{display:block;font-size:1.5rem;margin-bottom:4px}
.tile span{font-size:.82rem;opacity:.8}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px}
button,.btn{font:inherit;font-weight:600;border:0;cursor:pointer;padding:13px 24px;border-radius:99px;transition:.25s}
.b1{background:linear-gradient(90deg,#ffd86b,#ff9a5b);color:#2b1a00}
.b2{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
a.btn{text-decoration:none}
button:hover,.btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.wishwall{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wish{background:rgba(255,255,255,.08);border-radius:99px;padding:8px 14px;font-size:.85rem;animation:rise .5s both}
footer{margin-top:26px;font-size:.78rem;opacity:.55}
.ic{vertical-align:middle;flex:0 0 auto}
.ib{display:inline-flex;vertical-align:-4px;color:#ffd86b}
.sig .ib{color:#ffd86b}
button,.btn{display:inline-flex;align-items:center;gap:9px}
.tile b{color:#ffd86b;display:flex;justify-content:center;margin-bottom:8px}
.wish{display:inline-flex;align-items:center;gap:7px}
.wish .ic{color:#ffd86b}
.hint{display:flex;align-items:center;gap:10px}
.hint .ic{color:#ffd7a0}

.cakewrap{margin:34px auto 6px;display:flex;flex-direction:column;align-items:center;gap:12px}
.cake{position:relative;width:210px;height:170px;cursor:pointer;transition:transform .3s}
.cake:hover{transform:translateY(-5px)}
.layer{position:absolute;left:50%;transform:translateX(-50%);border-radius:10px}
.layer.base{bottom:14px;width:200px;height:44px;background:linear-gradient(180deg,#8d5524,#6b3f19)}
.layer.mid{bottom:56px;width:166px;height:38px;background:linear-gradient(180deg,#ffb3c6,#ef7fa0)}
.layer.top{bottom:92px;width:132px;height:30px;background:linear-gradient(180deg,#fff3dd,#ffd9a8)}
.plate{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:230px;height:14px;border-radius:50%;
 background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08));box-shadow:0 10px 26px rgba(0,0,0,.5)}
.drip{position:absolute;top:24px;width:16px;height:16px;border-radius:0 0 12px 12px;background:#fff3dd}
.drip{left:6px}.drip.d2{left:32px;height:22px}.drip.d3{left:58px;height:13px}
.drip.d4{left:84px;height:20px}.drip.d5{left:108px;height:15px}
.candle{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);width:11px;height:34px;border-radius:3px;
 background:repeating-linear-gradient(45deg,#fff 0 5px,#ff6b6b 5px 10px)}
.candle.c2{margin-left:-38px}.candle.c3{margin-left:38px}
.flame{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:13px;height:20px;
 border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
 background:radial-gradient(circle at 50% 70%,#fff6c2,#ffb800 55%,#ff5d00);
 box-shadow:0 0 18px 6px rgba(255,170,0,.55);animation:flick .28s infinite alternate;transform-origin:bottom}
@keyframes flick{from{transform:translateX(-50%) scale(1) rotate(-3deg)}to{transform:translateX(-50%) scale(1.14,.9) rotate(3deg)}}
.cake.out .flame{opacity:0;transform:translateX(-50%) scale(.2);animation:none;box-shadow:none;transition:.4s}
.cakehint{font-size:.8rem;letter-spacing:1px;color:#ffd7a0;opacity:.8}
.fblink{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-size:.85rem;opacity:.9}
.fblink a{color:#8fd3ff;font-weight:600;word-break:break-all}
.copy{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);padding:6px 14px;font-size:.78rem;border-radius:99px}
.dev{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:12px;
 font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase;opacity:1}
.dev b{background:linear-gradient(90deg,#ffd86b,#ff8fab,#8fd3ff);background-size:200% auto;
 -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;animation:shine 5s linear infinite}
.devline{width:44px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,216,107,.8),transparent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>

<canvas id="stars"></canvas>
<canvas class="confetti" id="conf"></canvas>

<div class="wrap">
  <div class="stage" id="stage">

      <div class="env-back"></div>
      <div class="letter">
        <h3>For Sir Jose Manuel R. Guitarte</h3>
        <p>A little something from your CSS class <span class="ib"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/></svg></span></p>

      <div class="flap"></div>
      <div class="wax">JG</div>
    </div>
  </div>
